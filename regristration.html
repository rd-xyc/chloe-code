<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SPA Student Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:        #FBF5EF;
            --cream-deep:   #F3E7DC;
            --blush:        #F3D9DE;
            --blush-soft:   #FBEDEF;
            --rose:         #C17C87;
            --rose-deep:    #8C4E58;
            --plum-ink:     #4A3540;
            --plum-soft:    #8B7581;
            --sage:         #A9BB9C;
            --gold-line:    #D9B98A;
            --white-veil:   rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Quicksand", sans-serif;
            color: var(--plum-ink);

            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(ellipse 60% 45% at 12% 8%, var(--blush) 0%, transparent 60%),
                radial-gradient(ellipse 55% 40% at 92% 88%, var(--sage) 0%, transparent 55%),
                linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
            background-attachment: fixed;
        }

        .sprig {
            position: fixed;
            fill: none;
            stroke: var(--gold-line);
            stroke-width: 1.4;
            stroke-linecap: round;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .sprig--tl { top: 18px; left: 18px; width: 130px; transform: rotate(-6deg); }
        .sprig--br { bottom: 18px; right: 18px; width: 150px; transform: rotate(180deg) rotate(-8deg); }

        @media (max-width: 640px) {
            .sprig--tl { width: 90px; }
            .sprig--br { width: 100px; }
        }


        .reg-header {
            position: relative;
            z-index: 2;
            padding: 22px 0 0 20px;
        }

        .exit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 22px;

            border: 1.5px solid var(--rose-deep);
            border-radius: 999px;

            background: var(--white-veil);
            color: var(--rose-deep);
            backdrop-filter: blur(2px);

            font-family: "Quicksand", sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.02em;

            text-decoration: none;

            transition: all .25s ease;
        }

        .exit-btn:hover,
        .exit-btn:focus-visible {
            background: var(--rose-deep);
            color: var(--cream);
            transform: translateY(-2px);
        }


        .reg-main {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 5% 60px;
        }

        .reg-box {
            width: min(640px, 96%);

            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(140, 78, 88, 0.16);
            border-radius: 28px;
            box-shadow: 0 24px 60px -20px rgba(74, 53, 64, 0.35);
            backdrop-filter: blur(6px);

            padding: 46px 44px 40px;

            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .reg-eyebrow {
            font-family: "Parisienne", cursive;
            font-size: 26px;
            color: var(--rose);
            line-height: 1;
        }

        .reg-title {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-weight: 600;
            font-size: 34px;
            color: var(--plum-ink);
            margin-top: 2px;
        }

        .reg-divider {
            width: 64px;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, var(--gold-line), transparent);
            margin: 6px 0 4px;
        }

        .reg-intro {
            font-size: 13px;
            color: var(--plum-soft);
            margin-top: -14px;
        }

        .reg-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section {
            border: 1px solid rgba(140, 78, 88, 0.16);
            border-radius: 18px;

            padding: 22px 22px 20px;

            display: flex;
            flex-direction: column;
            gap: 4px;

            background: rgba(255, 255, 255, 0.4);
        }

        .form-section legend {
            padding: 0 8px;

            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 18px;
            font-weight: 600;
            color: var(--rose-deep);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-group {
            flex: 1 1 160px;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group-small {
            flex: 0 1 110px;
        }

        .form-group label {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--plum-soft);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 44px;

            padding: 0 15px;

            border: 1.5px solid #E4CFD3;
            border-radius: 12px;

            background-color: rgba(255, 255, 255, 0.85);
            color: var(--plum-ink);

            font-family: "Quicksand", sans-serif;
            font-size: 14px;
            font-weight: 500;

            outline: none;
            cursor: pointer;

            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="date"] {
            cursor: text;
        }

        .form-group input[readonly] {
            background-color: rgba(243, 231, 220, 0.6);
            color: var(--plum-soft);
            cursor: default;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 4px rgba(193, 124, 135, 0.16);
        }

        ::placeholder {
            color: #B7A6AD;
        }


        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 46px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;

            background: transparent;
            border: none;

            font-size: 15px;
            line-height: 1;

            cursor: pointer;
            opacity: .55;

            transition: opacity .2s ease, transform .2s ease;
        }

        .toggle-btn:hover {
            opacity: 1;
        }

        .field-note {
            font-size: 12px;
            color: #B23B4E;
            min-height: 14px;
        }


        .register-btn {
            align-self: center;

            width: min(300px, 100%);
            height: 48px;

            border: none;
            border-radius: 999px;

            background: linear-gradient(120deg, var(--rose) 0%, var(--rose-deep) 100%);
            color: var(--cream);

            font-family: "Quicksand", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;

            cursor: pointer;

            transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
        }

        .register-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -8px rgba(140, 78, 88, 0.55);
        }

        .register-btn:disabled {
            background: #CBB9BE;
            cursor: not-allowed;
        }

        .register-btn:focus-visible,
        .exit-btn:focus-visible,
        .toggle-btn:focus-visible,
        .form-group input:focus-visible,
        .form-group select:focus-visible {
            outline: 2px solid var(--rose-deep);
            outline-offset: 2px;
        }

        .feedback-error {
            font-size: 12.5px;
            color: #B23B4E;
            text-align: center;
            min-height: 16px;
        }

        .feedback-success {
            font-size: 12.5px;
            color: #4C7A5C;
            text-align: center;
            min-height: 16px;
        }

        .reg-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--plum-soft);
        }

        .reg-footer a {
            color: var(--rose-deep);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--gold-line);
        }

        .reg-footer a:hover {
            color: var(--rose);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

        @media (max-width: 700px) {
            .reg-box {
                padding: 34px 26px;
                border-radius: 22px;
            }

            .form-section {
                padding: 18px 16px;
            }

            .reg-title {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .exit-btn {
                padding: 8px 16px;
                font-size: 11.5px;
            }

            .reg-main {
                padding: 84px 4% 40px;
            }

            .reg-box {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <svg class="sprig sprig--tl" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 4 C 30 20, 40 45, 60 60" />
        <path d="M18 16 C 24 26, 20 34, 10 38" />
        <path d="M32 30 C 40 36, 44 44, 40 54" />
        <path d="M46 44 C 54 48, 58 56, 54 66" />
        <circle cx="60" cy="60" r="2.4" fill="var(--gold-line)" stroke="none" />
    </svg>

    <svg class="sprig sprig--br" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 4 C 30 20, 40 45, 60 60" />
        <path d="M18 16 C 24 26, 20 34, 10 38" />
        <path d="M32 30 C 40 36, 44 44, 40 54" />
        <path d="M46 44 C 54 48, 58 56, 54 66" />
        <circle cx="60" cy="60" r="2.4" fill="var(--gold-line)" stroke="none" />
    </svg>

    <header class="reg-header">
        <a class="exit-btn" href="#" id="exitBtn">← Back</a>
    </header>

    <main class="reg-main">
        <div class="reg-box">

            <div>
                <p class="reg-eyebrow">join us,</p>
                <h1 class="reg-title">Create your student account</h1>
                <hr class="reg-divider">
                <p class="reg-intro">Fill in the details below — every field marked is required.</p>
            </div>

            <form class="reg-form" id="registrationForm" novalidate>

                <fieldset class="form-section">
                    <legend>Personal information</legend>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="LRN">Learner Reference Number (LRN)</label>
                            <input type="text" id="LRN" inputmode="numeric" maxlength="12" placeholder="12-digit LRN" required pattern="\d{12}">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="Fname">First name</label>
                            <input type="text" id="Fname" placeholder="First name" required>
                        </div>

                        <div class="form-group">
                            <label for="Mname">Middle name</label>
                            <input type="text" id="Mname" placeholder="Middle name (optional)">
                        </div>

                        <div class="form-group">
                            <label for="Lname">Last name</label>
                            <input type="text" id="Lname" placeholder="Last name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group form-group-small">
                            <label for="Bdate">Birthdate</label>
                            <input type="date" id="Bdate" required>
                        </div>

                        <div class="form-group form-group-small">
                            <label for="Age">Age</label>
                            <input type="text" id="Age" placeholder="Auto" readonly>
                        </div>

                        <div class="form-group">
                            <label for="Gender">Gender</label>
                            <select id="Gender" name="gender" required>
                                <option value="" disabled selected>Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Account credentials</legend>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="Password">Password</label>
                            <div class="password-field">
                                <input type="password" id="Password" placeholder="Create a password" minlength="6" required>
                                <button type="button" class="toggle-btn" id="togglePassword" aria-label="Show password">👁</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ConfirmPassword">Confirm password</label>
                            <div class="password-field">
                                <input type="password" id="ConfirmPassword" placeholder="Re-enter password" minlength="6" required>
                                <button type="button" class="toggle-btn" id="toggleConfirmPassword" aria-label="Show password">👁</button>
                            </div>
                        </div>
                    </div>

                    <p class="field-note" id="passwordMismatch" role="alert"></p>
                </fieldset>

                <button type="submit" id="RegisterBtn" class="register-btn" disabled>Register</button>

                <p class="feedback-error" id="feedbackError" role="alert"></p>
                <p class="feedback-success" id="feedbackSuccess" role="status"></p>

            </form>

            <p class="reg-footer">Already have an account? <a href="login.html">Log in here</a></p>

        </div>
    </main>

    <script>
        (function () {
            const form = document.getElementById("registrationForm");
            const button = document.getElementById("RegisterBtn");
            const password = document.getElementById("Password");
            const confirmPassword = document.getElementById("ConfirmPassword");
            const mismatchNote = document.getElementById("passwordMismatch");
            const feedbackError = document.getElementById("feedbackError");
            const feedbackSuccess = document.getElementById("feedbackSuccess");
            const bdate = document.getElementById("Bdate");
            const age = document.getElementById("Age");
            const lrn = document.getElementById("LRN");

            function wireToggle(toggleId, inputEl) {
                const toggle = document.getElementById(toggleId);
                toggle.addEventListener("click", function () {
                    if (inputEl.type === "password") {
                        inputEl.type = "text";
                        this.textContent = "🙈";
                        this.setAttribute("aria-label", "Hide password");
                    } else {
                        inputEl.type = "password";
                        this.textContent = "👁";
                        this.setAttribute("aria-label", "Show password");
                    }
                });
            }

            wireToggle("togglePassword", password);
            wireToggle("toggleConfirmPassword", confirmPassword);


            lrn.addEventListener("input", function () {
                this.value = this.value.replace(/\D/g, "").slice(0, 12);
            });

  
            function calculateAge(dateStr) {
                const dob = new Date(dateStr);
                if (isNaN(dob.getTime())) return "";
                const today = new Date();
                let years = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                    years--;
                }
                return years >= 0 ? years : "";
            }

            bdate.addEventListener("input", function () {
                age.value = calculateAge(this.value);
            });

  
            function checkPasswordsMatch() {
                if (confirmPassword.value && password.value !== confirmPassword.value) {
                    mismatchNote.textContent = "Passwords do not match.";
                    return false;
                }
                mismatchNote.textContent = "";
                return true;
            }

            [password, confirmPassword].forEach(el => {
                el.addEventListener("input", checkPasswordsMatch);
            });


            form.addEventListener("input", function () {
                const passwordsOk = checkPasswordsMatch();
                button.disabled = !(form.checkValidity() && passwordsOk);
                feedbackError.textContent = "";
                feedbackSuccess.textContent = "";
            });

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                if (!form.checkValidity() || !checkPasswordsMatch()) {
                    feedbackError.textContent = "Please check the highlighted fields and try again.";
                    return;
                }

                feedbackError.textContent = "";
                feedbackSuccess.textContent = "Account created! You may now log in.";
                button.disabled = true;
            });
        })();
    </script>

</body>
</html>
