<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — SPA Student Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:        #FBF5EF;
            --cream-deep:   #F3E7DC;
            --blush:        #F3D9DE;
            --rose:         #C17C87;
            --rose-deep:    #8C4E58;
            --plum-ink:     #4A3540;
            --plum-soft:    #8B7581;
            --sage:         #A9BB9C;
            --gold-line:    #D9B98A;
            --white-veil:   rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Quicksand", sans-serif;
            color: var(--plum-ink);

            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(ellipse 55% 42% at 90% 10%, var(--blush) 0%, transparent 58%),
                radial-gradient(ellipse 55% 40% at 8% 92%, var(--sage) 0%, transparent 55%),
                linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
            background-attachment: fixed;
        }


        .sprig {
            position: fixed;
            fill: none;
            stroke: var(--gold-line);
            stroke-width: 1.4;
            stroke-linecap: round;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .sprig--tr { top: 18px; right: 18px; width: 130px; transform: scaleX(-1) rotate(-6deg); }
        .sprig--bl { bottom: 18px; left: 18px; width: 150px; transform: scaleX(-1) rotate(180deg) rotate(-8deg); }

        @media (max-width: 640px) {
            .sprig--tr { width: 90px; }
            .sprig--bl { width: 100px; }
        }

        .login-header {
            position: relative;
            z-index: 2;
            padding: 22px 20px 0 0;
            display: flex;
            justify-content: flex-end;
        }

        .exit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 22px;

            border: 1.5px solid var(--rose-deep);
            border-radius: 999px;

            background: var(--white-veil);
            color: var(--rose-deep);
            backdrop-filter: blur(2px);

            font-family: "Quicksand", sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.02em;

            text-decoration: none;

            transition: all .25s ease;
        }

        .exit-btn:hover,
        .exit-btn:focus-visible {
            background: var(--rose-deep);
            color: var(--cream);
            transform: translateY(-2px);
        }


        .login-main {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 5%;
        }

        .login-box {
            width: min(440px, 96%);

            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(140, 78, 88, 0.16);
            border-radius: 28px;
            box-shadow: 0 24px 60px -20px rgba(74, 53, 64, 0.35);
            backdrop-filter: blur(6px);

            padding: 46px 40px 40px;

            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .login-eyebrow {
            font-family: "Parisienne", cursive;
            font-size: 26px;
            color: var(--rose);
            line-height: 1;
        }

        .login-title {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-weight: 600;
            font-size: 34px;
            color: var(--plum-ink);
            margin-top: 2px;
        }

        .login-divider {
            width: 64px;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, var(--gold-line), transparent);
            margin: 6px 0 4px;
        }

        .login-intro {
            font-size: 13px;
            color: var(--plum-soft);
            margin-top: -14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--plum-soft);
        }

        .form-group input {
            width: 100%;
            height: 44px;

            padding: 0 15px;

            border: 1.5px solid #E4CFD3;
            border-radius: 12px;

            background-color: rgba(255, 255, 255, 0.85);
            color: var(--plum-ink);

            font-family: "Quicksand", sans-serif;
            font-size: 14px;
            font-weight: 500;

            outline: none;
            cursor: text;

            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .form-group input:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 4px rgba(193, 124, 135, 0.16);
        }

        ::placeholder {
            color: #B7A6AD;
        }


        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 46px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;

            background: transparent;
            border: none;

            font-size: 15px;
            line-height: 1;

            cursor: pointer;
            opacity: .55;

            transition: opacity .2s ease;
        }

        .toggle-btn:hover {
            opacity: 1;
        }


        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--plum-soft);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember-me input {
            width: 15px;
            height: 15px;
            accent-color: var(--rose-deep);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--rose-deep);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid var(--gold-line);
        }

        .forgot-link:hover {
            color: var(--rose);
        }

        .login-btn {
            align-self: center;

            width: 100%;
            height: 48px;

            border: none;
            border-radius: 999px;

            background: linear-gradient(120deg, var(--rose) 0%, var(--rose-deep) 100%);
            color: var(--cream);

            font-family: "Quicksand", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;

            cursor: pointer;

            transition: transform .25s ease, box-shadow .25s ease;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -8px rgba(140, 78, 88, 0.55);
        }

        .login-btn:disabled {
            background: #CBB9BE;
            cursor: not-allowed;
        }

        .login-btn:focus-visible,
        .exit-btn:focus-visible,
        .toggle-btn:focus-visible,
        .form-group input:focus-visible {
            outline: 2px solid var(--rose-deep);
            outline-offset: 2px;
        }

        .feedback-error {
            font-size: 12.5px;
            color: #B23B4E;
            text-align: center;
            min-height: 16px;
        }

        .login-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--plum-soft);
        }

        .login-footer a {
            color: var(--rose-deep);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--gold-line);
        }

        .login-footer a:hover {
            color: var(--rose);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

        @media (max-width: 480px) {
            .exit-btn {
                padding: 8px 16px;
                font-size: 11.5px;
            }

            .login-main {
                padding: 84px 4% 40px;
            }

            .login-box {
                padding: 30px 22px;
                border-radius: 22px;
            }

            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <svg class="sprig sprig--tr" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 4 C 30 20, 40 45, 60 60" />
        <path d="M18 16 C 24 26, 20 34, 10 38" />
        <path d="M32 30 C 40 36, 44 44, 40 54" />
        <path d="M46 44 C 54 48, 58 56, 54 66" />
        <circle cx="60" cy="60" r="2.4" fill="var(--gold-line)" stroke="none" />
    </svg>

    <svg class="sprig sprig--bl" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 4 C 30 20, 40 45, 60 60" />
        <path d="M18 16 C 24 26, 20 34, 10 38" />
        <path d="M32 30 C 40 36, 44 44, 40 54" />
        <path d="M46 44 C 54 48, 58 56, 54 66" />
        <circle cx="60" cy="60" r="2.4" fill="var(--gold-line)" stroke="none" />
    </svg>

    <header class="login-header">
        <a class="exit-btn" href="#" id="exitBtn">← Back</a>
    </header>

    <main class="login-main">
        <div class="login-box">

            <div>
                <p class="login-eyebrow">welcome back,</p>
                <h1 class="login-title">Log in to your account</h1>
                <hr class="login-divider">
                <p class="login-intro">Enter your LRN and password to continue.</p>
            </div>

            <form class="login-form" id="loginForm" novalidate>

                <div class="form-group">
                    <label for="LRN">Learner Reference Number (LRN)</label>
                    <input type="text" id="LRN" inputmode="numeric" maxlength="12" placeholder="12-digit LRN" required pattern="\d{12}">
                </div>

                <div class="form-group">
                    <label for="Password">Password</label>
                    <div class="password-field">
                        <input type="password" id="Password" placeholder="Enter your password" minlength="6" required>
                        <button type="button" class="toggle-btn" id="togglePassword" aria-label="Show password">👁</button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="RememberMe">
                        Remember me
                    </label>
                    <a class="forgot-link" href="#">Forgot password?</a>
                </div>

                <button type="submit" id="LoginBtn" class="login-btn" disabled>Log In</button>

                <p class="feedback-error" id="feedbackError" role="alert"></p>

            </form>

            <p class="login-footer">Don't have an account? <a href="registration.html">Register here</a></p>

        </div>
    </main>

    <script>
        (function () {
            const form = document.getElementById("loginForm");
            const button = document.getElementById("LoginBtn");
            const password = document.getElementById("Password");
            const lrn = document.getElementById("LRN");
            const feedbackError = document.getElementById("feedbackError");

            function wireToggle(toggleId, inputEl) {
                const toggle = document.getElementById(toggleId);
                toggle.addEventListener("click", function () {
                    if (inputEl.type === "password") {
                        inputEl.type = "text";
                        this.textContent = "🙈";
                        this.setAttribute("aria-label", "Hide password");
                    } else {
                        inputEl.type = "password";
                        this.textContent = "👁";
                        this.setAttribute("aria-label", "Show password");
                    }
                });
            }

            wireToggle("togglePassword", password);

            lrn.addEventListener("input", function () {
                this.value = this.value.replace(/\D/g, "").slice(0, 12);
            });

            form.addEventListener("input", function () {
                button.disabled = !form.checkValidity();
                feedbackError.textContent = "";
            });

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                if (!form.checkValidity()) {
                    feedbackError.textContent = "Please enter a valid LRN and password.";
                    return;
                }

                feedbackError.textContent = "";

            });
        })();
    </script>

</body>
</html>
